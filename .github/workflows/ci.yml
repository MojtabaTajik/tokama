name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Nothing waits on a required check after a push, so a docs-only push can skip the run.
    # Pull requests cannot do this (a workflow that does not start leaves the required check
    # pending); they skip inside the run instead, see the plan job.
    paths-ignore:
      - "*.md"
      - "**/README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    # Nightly macOS run on main. The plan job skips it when main has no new commits since the
    # last successful nightly run.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their own outdated runs. Every other run gets its own group, so a
# push, the nightly run and a manual run on main never cancel or replace each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A small Linux job that decides what the other jobs do. It runs before the macOS job so the
  # nightly "nothing new" check costs Linux minutes, not macOS minutes. It fails open: if a
  # query fails, the change counts as code and the nightly run goes ahead.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      skip_nightly: ${{ steps.plan.outputs.skip_nightly }}
      removal_test: ${{ steps.plan.outputs.removal_test }}
      linux_package: ${{ steps.plan.outputs.linux_package }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          docs_only=false
          skip_nightly=false
          removal_test=true
          # The Linux packages are built on the nightly and manual runs, and on a pull request that
          # can change them: the build config, the packaging scripts, the pinned Node, the updater
          # code and the workflows. Never on a push to main: the pull request ran it.
          linux_package=false
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            linux_package=true
          fi
          if [ "$EVENT" = pull_request ]; then
            # Docs-only means every changed path (and every renamed-from path) is documentation:
            # docs/, issue templates, README files and Markdown files in the repository root.
            # Other Markdown files are code: tests and the removal test read them.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') || files=
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Evq '^(docs/|\.github/ISSUE_TEMPLATE/)|(^|/)README\.md$|^[^/]+\.md$'; then
              docs_only=true
            fi
            # The real-tree removal test only matters when a change can break it: adapters, the
            # composition file, core's exports, the apps, the removal test itself and the build
            # files (tsconfig, package.json, lockfile). An empty list (failed query) runs it.
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Eq '^(packages/core/src/adapters/|packages/core/src/composition\.ts$|packages/core/src/index\.ts$|apps/|tooling/removal-test/|pnpm-lock\.yaml$)|(^|/)(tsconfig[^/]*\.json|package\.json)$'; then
              removal_test=false
            fi
            # An empty list (failed query) builds them.
            if [ -z "$files" ] || printf '%s\n' "$files" | grep -Eq '^(\.github/workflows/|\.github/actions/|apps/desktop/(electron-builder\.yml$|scripts/|packaging/|src/main/update/))'; then
              linux_package=true
            fi
          elif [ "$EVENT" = schedule ]; then
            last=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || last=
            if [ -n "$last" ] && [ "$last" = "$SHA" ]; then
              skip_nightly=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "skip_nightly=$skip_nightly" >> "$GITHUB_OUTPUT"
          echo "removal_test=$removal_test" >> "$GITHUB_OUTPUT"
          echo "linux_package=$linux_package" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only skip_nightly=$skip_nightly removal_test=$removal_test linux_package=$linux_package"

  # The required check is `ci (ubuntu-latest)`. It must report on every pull request, so on a
  # docs-only change this job still starts and skips its steps; skipping the whole job would
  # report under an unexpanded matrix name and leave the required check pending.
  ci:
    name: ci (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip_nightly != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS on every pull request and on a manual run. Linux only on push to
        # main. macOS only on the nightly run.
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-latest"]' || (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # The macOS job also packages the app and runs it installed.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 40 || 20 }}
    steps:
      - name: Docs-only change, nothing to run
        if: needs.plan.outputs.docs_only == 'true'
        run: echo "Only documentation changed."
      - if: needs.plan.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.plan.outputs.docs_only != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: needs.plan.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm build
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm typecheck
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm lint
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm test:all
      # The run on the real tree: on pull requests only when the plan job saw a change that can
      # break it; always on push to main, the nightly run and manual runs. test:all already runs
      # the removal test's fixture cases.
      - name: Adapter removal test (real tree)
        if: needs.plan.outputs.docs_only != 'true' && needs.plan.outputs.removal_test == 'true'
        run: pnpm removal-test
      # Desktop UI flow tests: the built app on a sample engine. install-electron downloads the
      # Electron binary into this cache and checks it against electron's checksums.json, on a
      # cache hit too.
      - if: needs.plan.outputs.docs_only != 'true'
        name: Read the Electron version
        id: electron
        run: echo "version=$(node -p "require('./apps/desktop/node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: needs.plan.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which Chromium's
      # sandbox needs. Lift it on the runner rather than run the app with --no-sandbox.
      - name: Allow the Chromium sandbox
        if: runner.os == 'Linux' && needs.plan.outputs.docs_only != 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: needs.plan.outputs.docs_only != 'true'
        name: Desktop UI flow tests
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum pnpm --filter @tokama/desktop e2e
          else
            pnpm --filter @tokama/desktop e2e
          fi
      # The packaged app, installed as a user installs it: unsigned (ad-hoc) on CI. The package
      # step runs the layout, fuse, feed and hook checks on the build and its zip; the smoke test
      # then installs the dmg and runs the app.
      - if: runner.os == 'macOS' && needs.plan.outputs.docs_only != 'true'
        name: Package the app and smoke-test the installed copy
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          pnpm --filter @tokama/desktop package:dmg
          version=$(node -p "require('./apps/desktop/package.json').version")
          node apps/desktop/scripts/verify-package.ts --unsigned --app apps/desktop/release/mac-arm64/Tokama.app \
            --zip "apps/desktop/release/Tokama-$version-arm64-mac.zip" --latest apps/desktop/release/latest-mac.yml \
            --version "$version" --feed-url https://updates.tokama.dev/mac/
          node apps/desktop/scripts/smoke-installed.ts --dmg "apps/desktop/release/Tokama-$version-arm64.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && runner.os == 'macOS' && needs.plan.outputs.docs_only != 'true'
        with:
          name: smoke-output
          path: apps/desktop/smoke-output
          if-no-files-found: ignore
          retention-days: 14
      # Screenshots of the main screens, and of any failed flow, to check a change without running the app.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.plan.outputs.docs_only != 'true'
        with:
          name: desktop-screenshots-${{ matrix.os }}
          path: apps/desktop/e2e-output
          if-no-files-found: ignore
          retention-days: 14

  # The Linux packages as the release workflow builds them: the same steps (the linux-package
  # action), no secrets, no environment. The deb is installed on this runner and started under a
  # virtual display; the AppArmor restriction on user namespaces stays on (the `ci` job lifts it for
  # the UI tests, this job must not), so the app only starts through the profile the package installs.
  # The rpm is installed in a Fedora container, where its engine is started. Not a required check.
  linux-package:
    name: linux-package (ubuntu-latest)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip_nightly != 'true' && needs.plan.outputs.linux_package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./.github/actions/linux-package
        with:
          rpm-out: ${{ runner.temp }}/smoke-rpm
      - name: TEMP the deb resolves on Ubuntu 26.04
        run: docker run --rm -v "$PWD/apps/desktop/release:/r:ro" ubuntu:26.04 bash -euxo pipefail -c 'apt-get update && apt-get install -y /r/Tokama-*-amd64.deb && dpkg -s tokama | head -8'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-package-logs
          path: |
            apps/desktop/smoke-output
            ${{ runner.temp }}/smoke-rpm
            apps/desktop/release/latest-linux.yml
          if-no-files-found: ignore
          retention-days: 14

  # The lowest Node that package.json allows: node:sqlite runs there without a flag (with an
  # ExperimentalWarning on stderr). Not a required check. Nightly and manual runs only; the
  # packaged app ships its own pinned Node.
  node-min:
    name: node 22.18 (ubuntu-latest)
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.skip_nightly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:all
