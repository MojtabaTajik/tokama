# Packs the built app (dist/) and the engine folder staged by scripts/package.ts into Tokama.app.
# The mac block is release-ready (hardened runtime); scripts/package.ts overrides it for local ad-hoc builds.
appId: dev.tokama.app
productName: Tokama
directories:
  output: release
  buildResources: build
# dist/tsc holds declaration output only, so it stays out.
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
# The Electron that install-electron verified; nothing is downloaded twice.
electronDist: node_modules/electron/dist
extraResources:
  - from: package-stage/engine
    to: engine
  # Electron's and Chromium's licence texts sit beside Electron.app, not in it.
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE-electron
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
artifactName: ${productName}-${version}-${arch}.${ext}
# The update feed baked into the app (app-update.yml) and named in latest-mac.yml. Builds run with
# --publish never, so nothing is uploaded; scripts/package.ts --feed-url replaces the URL.
publish:
  provider: generic
  url: https://updates.tokama.dev/mac/
# Written into the asar's package.json, so the packaged app's name is "Tokama" (its data folder and
# single-instance lock); development keeps @tokama/desktop.
extraMetadata:
  productName: Tokama
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # grantFileProtocolExtraPrivileges stays on: the renderer loads from file://. Cookie encryption stays off: the app sets no cookies.
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # The zip is what the updater downloads; its name carries "-mac" so it differs from the dmg's.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The engine's Node binary is not inside a bundle, so it is named to be signed with the app.
  binaries:
    - Contents/Resources/engine/tokama-engine
  notarize: false
dmg:
  sign: true
  artifactName: ${productName}-${version}-${arch}.${ext}
  # latest-mac.yml lists the zip only; the dmg is stapled after the build, so its hash must not appear there.
  writeUpdateInfo: false
