# Packs the built app (dist/) and the engine folder staged by scripts/package.ts into Tokama.app.
# The mac block is release-ready (hardened runtime); scripts/package.ts overrides it for local ad-hoc builds.
appId: dev.tokama.app
productName: Tokama
directories:
  output: release
  buildResources: build
# dist/tsc holds declaration output only, so it stays out.
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
# The Electron that install-electron verified; nothing is downloaded twice.
electronDist: node_modules/electron/dist
extraResources:
  - from: package-stage/engine
    to: engine
  # The sounds sit at the top of Resources: macOS looks a notification's sound up by file name in the
  # app bundle, and the app's own player reads the same files.
  - from: src/renderer/brand/sounds/needs-you.wav
    to: tokama-needs-you.wav
  - from: src/renderer/brand/sounds/finished.wav
    to: tokama-finished.wav
  - from: src/renderer/brand/sounds/failed.wav
    to: tokama-failed.wav
  - from: src/renderer/brand/sounds/tokay-call.wav
    to: tokama-tokay-call.wav
  # The release notes ship with the app, so About lists them without a network.
  - from: ../../whats-new
    to: whats-new
    filter:
      - "[0-9]*.[0-9]*.[0-9]*.md"
  # Electron's and Chromium's licence texts sit beside Electron.app, not in it.
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE-electron
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
  # The licence texts of the open-source code built into the app; About opens this file.
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
artifactName: ${productName}-${version}-${arch}.${ext}
# The update feed baked into the app (app-update.yml) and named in latest-mac.yml. Builds run with
# --publish never, so nothing is uploaded; scripts/package.ts --feed-url replaces the URL.
publish:
  provider: generic
  url: https://updates.tokama.dev/mac/
# Written into the asar's package.json, so the packaged app's name is "Tokama" (its data folder and
# single-instance lock); development keeps @tokama/desktop.
extraMetadata:
  productName: Tokama
  # The Linux packages' URL field; electron-builder reads it from the package metadata.
  homepage: https://tokama.dev
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # grantFileProtocolExtraPrivileges stays on: the renderer loads from file://. Cookie encryption stays off: the app sets no cookies.
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # The zip is what the updater downloads; its name carries "-mac" so it differs from the dmg's.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The engine's Node binary is not inside a bundle, so it is named to be signed with the app.
  binaries:
    - Contents/Resources/engine/tokama-engine
  notarize: false
linux:
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  # The launcher in /opt/Tokama and the link /usr/bin/tokama; the .desktop entry and the icons use it too.
  executableName: tokama
  category: Development
  icon: build/icons
  maintainer: "Tokama <hello@tokama.dev>"
  vendor: Tokama
  synopsis: Agent workbench for engineers
  description: Tokama runs AI coding agents one step at a time, following templates you write. Each step says when it is done - the checks pass, a reviewer approves, or you approve.
  desktop:
    entry:
      # Electron names its window class after the product, so the launcher groups the window with this entry.
      StartupWMClass: Tokama
# The package names and dependencies repeat electron-builder's defaults (Electron's libraries) and add what
# Tokama runs: the library of the engine's own Node (the official build links libatomic), git, and
# bubblewrap and socat for the agents' sandbox. scripts/verify-package-linux.ts holds the same lists and
# fails when a built package differs.
deb:
  packageName: tokama
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libatomic1, git, bubblewrap, socat]
  fpm: ["--license=Apache-2.0"]
rpm:
  packageName: tokama
  depends: [gtk3, libnotify, nss, libXScrnSaver, "(libXtst or libXtst6)", xdg-utils, at-spi2-core, "(libuuid or libuuid1)", libatomic, git, bubblewrap, socat]
  fpm: ["--license=Apache-2.0"]
dmg:
  sign: true
  artifactName: ${productName}-${version}-${arch}.${ext}
  # latest-mac.yml lists the zip only; the dmg is stapled after the build, so its hash must not appear there.
  writeUpdateInfo: false
